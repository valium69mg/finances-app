# Reverse proxy of /api/* to the backend on the same origin. The /api prefix is stripped:
# the backend mounts its routes at the root (/auth/login, /invoices, ...).
#
# The upstream is resolved per request (Docker's embedded DNS) so recreating the api
# container does not leave nginx pointing at a stale address. "api-backend" is an alias
# the api has ONLY on the internal network: the plain name "api" also resolves to its
# address on the edge network, and the API would then see nginx as an untrusted peer.
resolver 127.0.0.11 valid=10s ipv6=off;
set $api_upstream api-backend:8080;
rewrite ^/api/(.*)$ /$1 break;
proxy_pass http://$api_upstream;

proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-ID $request_id;

# The client address the backend may trust (TRUSTED_PROXIES = this container). It is
# OVERWRITTEN with $remote_addr, which the real_ip module already resolved, so a value
# sent by the client never reaches the backend. Every other forwarding header is dropped.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header CF-Connecting-IP "";
proxy_set_header True-Client-IP "";
proxy_set_header Forwarded "";

proxy_connect_timeout 5s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;
proxy_max_temp_file_size 0;   # stream responses (10 MiB downloads), never spill to disk

# The backend already sets nosniff; nginx adds the shared security headers itself.
proxy_hide_header X-Content-Type-Options;

include /etc/nginx/snippets/security-headers.conf;

error_page 413 = @too_large;
error_page 429 = @rate_limited;
error_page 502 503 504 = @upstream_unavailable;
