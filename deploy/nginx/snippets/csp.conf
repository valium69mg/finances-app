# Content-Security-Policy of the single-page app. Strict on purpose: the app keeps its
# tokens in localStorage, so a script injection must not be able to run.
#  - script-src 'self': the Vite build emits only external module scripts (no inline ones).
#  - style-src 'self': Tailwind is compiled to a CSS file; React sets style props through
#    the CSSOM, which CSP allows. No 'unsafe-inline' and no 'unsafe-eval' anywhere.
#  - connect-src 'self': the API is same-origin (/api).
#  - font-src falls back to default-src 'self' (the IBM Plex fonts are bundled).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
