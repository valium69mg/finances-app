# Main nginx configuration of the production edge (nginxinc/nginx-unprivileged).
# Mounted read-only by docker-compose.prod.yml. Site config: templates/finances.conf.template.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # The unprivileged image runs as a non-root user: keep every temp path in /tmp (tmpfs).
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    server_tokens off;

    # --- Client IP behind Cloudflare -------------------------------------------------
    # CF-Connecting-IP is believed ONLY when the TCP peer is a Cloudflare address. From
    # any other peer the header is ignored, so a client that reaches the origin directly
    # cannot pick its own IP (and therefore its own rate-limit bucket).
    include /etc/nginx/cloudflare-ips.conf;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    # Operator-provided extras (Authenticated Origin Pulls, test peers). Empty by default.
    include /etc/nginx/optional/*.conf;

    # --- Logging ---------------------------------------------------------------------
    # The path only, never $request or $request_uri: the query string can carry the
    # single-use email verification token, and logs must not hold credentials.
    map $request_uri $request_path {
        ~^(?<path>[^?]*) $path;
        default          "-";
    }
    log_format main '$remote_addr [$time_iso8601] "$request_method $request_path $server_protocol" '
                    '$status $body_bytes_sent rt=$request_time urt=$upstream_response_time '
                    'id=$request_id';
    access_log /dev/stdout main;

    # --- Limits and timeouts ---------------------------------------------------------
    # One bucket per real client IP (after the real_ip rewrite above).
    limit_req_zone  $binary_remote_addr zone=auth:10m rate=20r/m;   # /api/auth/*: strict
    limit_req_zone  $binary_remote_addr zone=api:10m  rate=20r/s;   # the rest of /api/
    limit_req_zone  $binary_remote_addr zone=web:10m  rate=20r/s;   # the static app
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_req_status  429;
    limit_conn_status 429;
    limit_req_log_level  warn;
    limit_conn_log_level warn;

    client_header_timeout 10s;
    client_body_timeout   30s;
    send_timeout          30s;
    keepalive_timeout     30s;
    reset_timedout_connection on;
    client_header_buffer_size 2k;
    large_client_header_buffers 4 8k;
    client_max_body_size 1m;       # default; the invoice upload location raises it

    sendfile on;
    tcp_nopush on;

    # --- Compression -----------------------------------------------------------------
    # Static text only: API JSON is not compressed on purpose (it carries session tokens).
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css text/plain text/javascript application/javascript image/svg+xml;

    # --- TLS (Cloudflare Origin CA certificate, SSL mode "Full (strict)") -------------
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/conf.d/*.conf;
}
